<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMD Sequence Aligner | Enterprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --primary: #10b981; /* Emerald Green */
            --primary-glow: rgba(16, 185, 129, 0.4);
            --secondary: #3b82f6; /* Blue */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #27272a;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
            padding: 2rem;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .header span {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: bold;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Custom File Upload */
        .file-upload-wrapper {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }
        
        .file-upload-wrapper:hover {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
        }

        input[type="file"] {
            display: none;
        }

        /* Custom Sliders */
        .slider-group { margin-bottom: 1.5rem; }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .slider-group span { color: var(--secondary); font-weight: bold; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        /* Execute Button */
        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 6px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 25px var(--primary-glow);
        }
        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Telemetry Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .metric-title {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .metric-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Visualizer & Console */
        canvas {
            width: 100%;
            border-radius: 8px;
            background: #000;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        #console {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            height: 150px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: pre-wrap;
        }
        .log-sys { color: var(--secondary); }
        .log-warn { color: #f59e0b; }
        .log-success { color: var(--primary); }
        .log-error { color: #ef4444; }

        @media (max-width: 900px) {
            .dashboard { grid-template-columns: 1fr; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SIMD Sequence Aligner</h1>
        <span>WebAssembly Kernel v1.0 // Hardware-Accelerated</span>
    </div>

    <div class="dashboard">
        <!-- LEFT PANEL: CONTROLS -->
        <div class="panel">
            <label class="file-upload-wrapper" for="fileUpload">
                <div style="color: var(--primary); margin-bottom: 10px;">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <div id="fileLabel" style="color: var(--text-muted); font-size: 0.9rem;">Click to upload .fastq data</div>
                <input type="file" id="fileUpload" accept=".txt,.fastq,.fq">
            </label>

            <div class="slider-group">
                <label>k-mer Window Size <span id="kmerVal">21</span></label>
                <input type="range" id="kmerSlider" min="9" max="31" value="21">
            </div>

            <div class="slider-group">
                <label>s-mer Hash Size <span id="smerVal">7</span></label>
                <input type="range" id="smerSlider" min="3" max="11" value="7">
            </div>

            <button id="runBtn">Execute Kernel</button>
        </div>

        <!-- RIGHT PANEL: TELEMETRY -->
        <div class="panel">
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Reads Parsed</div>
                    <div class="metric-value" id="val-reads">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Bases Processed</div>
                    <div class="metric-value" id="val-bases">0</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Compression</div>
                    <div class="metric-value" id="val-ratio">0.00x</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Execution Time</div>
                    <div class="metric-value" id="val-time">0ms</div>
                </div>
            </div>

            <canvas id="densityMap" width="1000" height="120"></canvas>
            <div id="console"><span class="log-sys">[SYSTEM]</span> Initializing core runtime... Awaiting payload.</div>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('console');
        const canvas = document.getElementById('densityMap');
        const ctx = canvas.getContext('2d');
        const runBtn = document.getElementById('runBtn');
        const fileLabel = document.getElementById('fileLabel');
        let dnaPayload = "";

        function log(msg, type="sys") {
            const time = new Date().toISOString().split('T')[1].substring(0,8);
            terminal.innerHTML += `\n<span class="log-${type}">[${time}]</span> ${msg}`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        document.getElementById('kmerSlider').oninput = (e) => document.getElementById('kmerVal').innerText = e.target.value;
        document.getElementById('smerSlider').oninput = (e) => document.getElementById('smerVal').innerText = e.target.value;

        document.getElementById('fileUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            fileLabel.innerText = file.name;
            fileLabel.style.color = "var(--text-main)";
            
            log(`Reading payload: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`, "warn");
            const reader = new FileReader();
            reader.onload = (event) => {
                dnaPayload = event.target.result;
                log(`Payload loaded to heap memory. Ready.`, "success");
            };
            reader.readAsText(file);
        });

        function renderDensityMap(compressionRatio) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const activeBlocks = Math.floor((canvas.width * 20) / (compressionRatio || 1));
            
            ctx.fillStyle = '#10b981';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#10b981';
            
            for (let i = 0; i < activeBlocks; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const w = Math.random() * 3 + 1;
                ctx.fillRect(x, y, w, w);
            }
        }

        const worker = new Worker('worker.js', { type: 'module' });

        worker.onmessage = (event) => {
            if (event.data.type === 'READY') {
                log('Background WebWorker Thread: ACTIVE', 'success');
            } else if (event.data.type === 'RESULT') {
                const metrics = event.data.metrics;
                
                // Update UI Cards
                document.getElementById('val-reads').innerText = parseInt(metrics.reads_processed).toLocaleString();
                document.getElementById('val-bases').innerText = parseInt(metrics.bases_processed).toLocaleString();
                document.getElementById('val-ratio').innerText = `${metrics.compression_ratio}x`;
                document.getElementById('val-time').innerText = `${metrics.time_ms}ms`;

                renderDensityMap(metrics.compression_ratio);
                
                runBtn.innerText = "EXECUTE KERNEL";
                runBtn.disabled = false;
                log(`Execution Complete. Status: ${metrics.status}`, "success");
            }
        };

        runBtn.addEventListener('click', () => {
            if (!dnaPayload) {
                log('ERROR: No genomic sequence detected in heap.', 'error');
                return;
            }
            const k = parseInt(document.getElementById('kmerSlider').value);
            const s = parseInt(document.getElementById('smerSlider').value);
            
            if (s >= k) {
                log('ERROR: s-mer constraint violation. Must be strictly less than k-mer.', 'error');
                return;
            }
            
            runBtn.innerText = "PROCESSING PAYLOAD...";
            runBtn.disabled = true;
            log(`Dispatching pointers to Rust SIMD backend (k=${k}, s=${s})...`, "sys");
            
            // Clear previous UI
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('val-reads').innerText = "---";
            document.getElementById('val-bases').innerText = "---";
            document.getElementById('val-ratio').innerText = "---";
            document.getElementById('val-time').innerText = "---";
            
            worker.postMessage({ dna: dnaPayload, k: k, s: s });
        });
    </script>
</body>
</html>
